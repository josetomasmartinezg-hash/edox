<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>edox — Plano 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="brand">
          <span class="brand-mark">edox</span>
          <span class="brand-sub">del plano al volumen</span>
        </div>
        <p class="lede">
          Modelo vivo: gíralo o recórrelo a pie. Izquierda baja → centro a
          4&nbsp;m.
        </p>
        <div class="mode-switch" role="group" aria-label="Modo de cámara">
          <button type="button" class="mode-btn is-active" id="mode-orbit" data-mode="orbit">
            Orbitar
          </button>
          <button type="button" class="mode-btn" id="mode-walk" data-mode="walk">
            Recorrer
          </button>
        </div>
        <div class="controls">
          <label class="toggle">
            <input type="checkbox" id="toggle-plan" checked />
            Plano en suelo
          </label>
          <label class="toggle">
            <input type="checkbox" id="toggle-glass" checked />
            Cristalería
          </label>
          <label class="toggle">
            <input type="checkbox" id="toggle-levels" checked />
            Rampa / plinto
          </label>
          <label class="toggle">
            <input type="checkbox" id="toggle-roof" />
            Cubierta (sigue la subida)
          </label>
          <button type="button" id="btn-reset" class="btn">Reset cámara</button>
        </div>
      </header>
      <canvas id="c"></canvas>
      <div id="drag-cue" class="drag-cue" aria-hidden="true">
        <span class="drag-cue-hand">⟷</span>
        <span>Arrastra para mover</span>
      </div>
      <footer class="hint" id="hint">Cargando modelo interactivo…</footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
