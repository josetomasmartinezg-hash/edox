<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 92" role="img" aria-label="Soinver Ingeniería">
  <!--
    Logo Soinver — colores fijos de marca:
    rojo #E30613 · negro #111111 · gris #707070
    No usa currentColor para evitar que el tema altere el logo.
  -->
  <g fill="none" stroke="#E30613" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- Marca: trazo tipo “S / A” inclinada -->
    <path d="M22 22
             C22 12 30 6 42 6
             C56 6 64 14 64 24
             C64 34 56 40 42 46
             C30 51 22 57 22 68
             C22 80 32 88 48 88
             C62 88 72 80 72 68"/>
  </g>
  <g font-family="Arial Black, Helvetica Neue, Arial, sans-serif">
    <text x="92" y="48" font-size="36" font-weight="900" letter-spacing="1.8" fill="#111111">SOINVER</text>
  </g>
  <line x1="92" y1="60" x2="178" y2="60" stroke="#707070" stroke-width="2.5"/>
  <text
    x="186"
    y="65"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-size="13"
    font-weight="600"
    letter-spacing="2.4"
    fill="#707070"
  >INGENIERIA</text>
</svg>
